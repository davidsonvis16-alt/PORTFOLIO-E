    <style>
      /* Intro: the Tess mark on a white page for 1.3s, drawn before any JS loads. */
      #intro { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #ffffff; transition: opacity 0.5s cubic-bezier(0.25, 0.1, 0.25, 1), visibility 0.5s; }
      #intro.out { opacity: 0; visibility: hidden; }
      #intro span { font-family: "Inter", -apple-system, Arial, sans-serif; font-weight: 700; font-size: clamp(56px, 12vw, 120px); letter-spacing: -0.05em; line-height: 1; color: #111111; animation: intro-in 0.7s cubic-bezier(0.25, 0.1, 0.25, 1) both; }
      #intro span { display: inline-flex; flex-direction: column; align-items: flex-start; }
      #intro b { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; line-height: 0.72; font-size: 1.5em; }
      #intro svg { width: 2.55em; height: auto; margin-top: 0.04em; transform-origin: left center; animation: intro-draw 0.6s cubic-bezier(0.25, 0.1, 0.25, 1) 0.45s both; }
      @keyframes intro-draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      @keyframes intro-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes intro-dot { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
      html.intro, html.intro body { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { #intro span, #intro svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true"><span><b>Tess</b><svg viewBox="0 0 106 16"><path d="M3.2 9.6C17 7.1 33.4 8.6 49.6 8.9c15.8.3 31.4-1.6 44.9-2.9 1.6-.2 2.6 1.6 1.2 2.4-.6.3-1.5.4-2.6.6-14.6 2.3-29.6 4.6-45.1 4.4C33.1 13.2 18.6 12.1 4 12.7c-1.9.1-2.6-2.7-.8-3.1Z" fill="#111111"/><circle cx="101.6" cy="6.2" r="3.4" fill="#ff7ab6"/></svg></span></div>
    <script>
      /* Once per visit (browser tab session). The app calls __introDone
         when it has rendered; the intro holds until 1.3s have passed. */
      (function () {
        var el = document.getElementById("intro");
        var seen = false;
        try { seen = sessionStorage.getItem("tess-intro") === "1"; sessionStorage.setItem("tess-intro", "1"); } catch (e) {}
        if (seen) { el.remove(); window.__introDone = function () {}; return; }
        document.documentElement.classList.add("intro");
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          el.classList.add("out");
          document.documentElement.classList.remove("intro");
          setTimeout(function () { el.remove(); }, 600);
        }
        window.__introDone = function () { setTimeout(hide, Math.max(0, 1300 - performance.now())); };
        setTimeout(hide, 5000);
      })();
    </script>
