    <style>
      /* Intro: eden. on a white page for 1.3s, drawn before any JS loads. */
      #intro { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #f7f6f2; transition: opacity 0.5s cubic-bezier(0.25, 0.1, 0.25, 1), visibility 0.5s; }
      #intro.out { opacity: 0; visibility: hidden; }
      #intro span { font-family: "Inter", -apple-system, Arial, sans-serif; font-weight: 700; font-size: clamp(56px, 12vw, 120px); letter-spacing: -0.05em; line-height: 1; color: #111111; animation: intro-in 0.7s cubic-bezier(0.25, 0.1, 0.25, 1) both; }
      #intro i { font-style: normal; display: inline-block; animation: intro-dot 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) 0.55s both; }
      @keyframes intro-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes intro-dot { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: none; } }
      html.intro, html.intro body { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { #intro span, #intro i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true"><span>eden<i>.</i></span></div>
    <script>
      /* Once per visit (browser tab session). The app calls __introDone
         when it has rendered; the intro holds until 1.3s have passed. */
      (function () {
        var el = document.getElementById("intro");
        var seen = false;
        try { seen = sessionStorage.getItem("eden-intro") === "1"; sessionStorage.setItem("eden-intro", "1"); } catch (e) {}
        if (seen) { el.remove(); window.__introDone = function () {}; return; }
        document.documentElement.classList.add("intro");
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          el.classList.add("out");
          document.documentElement.classList.remove("intro");
          setTimeout(function () { el.remove(); }, 600);
        }
        window.__introDone = function () { setTimeout(hide, Math.max(0, 1300 - performance.now())); };
        setTimeout(hide, 5000);
      })();
    </script>
